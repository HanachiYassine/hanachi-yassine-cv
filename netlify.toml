[build]
  base = "backend"
  # Réinstaller aussi les modules natifs historiques suivis dans Git.
  command = "npm ci --include=dev --no-audit --no-fund && npm run build:netlify"
  # Chaque commit promu doit annoncer son SHA, même si seul Angular a changé.
  ignore = "exit 1"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  PUPPETEER_SKIP_DOWNLOAD = "true"
  CYPRESS_INSTALL_BINARY = "0"
  # Ces paramètres publics déclenchent des faux positifs ; les credentials restent scannés.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,CORS_ORIGINS,DATABASE_PROVIDER,NODE_ENV,TURSO_DATABASE_URL"

[functions]
  node_bundler = "zisi"
  # Les exports import/require des navigateurs utilisent des arbres différents.
  # Conserver les dépendances complètes permet les imports ESM du PDF dans Lambda.
  included_files = ["schema.sql", "data.json", "template.ejs", "migrations/*.sql", "../src/assets/cv-profile.jpeg", "node_modules/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
