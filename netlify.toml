[build]
  base = "backend"
  command = "npm run build:netlify"
  # Chaque commit promu doit annoncer son SHA, même si seul Angular a changé.
  ignore = "exit 1"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  PUPPETEER_SKIP_DOWNLOAD = "true"

[functions]
  node_bundler = "zisi"
  included_files = ["schema.sql", "data.json", "template.ejs", "migrations/*.sql", "../src/assets/cv-profile.jpeg"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
