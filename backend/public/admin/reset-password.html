<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
    <title>Nouveau mot de passe - Administration CV</title>
    <link rel="stylesheet" href="./password-recovery.css">
    <script src="./password-recovery.js" defer></script>
</head>
<body>
    <main class="recovery recovery--card">
        <h1>Nouveau mot de passe</h1>
        <p>Choisissez un mot de passe d’au moins 12 caractères, puis confirmez-le.</p>
        <form id="resetPasswordForm">
            <label class="recovery__label" for="newPassword">Nouveau mot de passe</label>
            <input class="recovery__input" type="password" id="newPassword" minlength="12" maxlength="72" autocomplete="new-password" required>
            <label class="recovery__label" for="passwordConfirmation">Confirmer le mot de passe</label>
            <input class="recovery__input" type="password" id="passwordConfirmation" minlength="12" maxlength="72" autocomplete="new-password" required>
            <button class="recovery__button" type="submit" id="resetPasswordButton">Modifier le mot de passe</button>
        </form>
        <p class="recovery__message" id="recoveryMessage" role="status" aria-live="polite" aria-atomic="true"></p>
        <a class="recovery__link" href="./">Retour à la connexion</a>
    </main>
</body>
</html>
