name: Vérification et déploiement du CV
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_API_URL: https://soft-tartufo-259d9b.netlify.app
concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deployment-config:
    name: Vérifier la configuration du déploiement
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Signaler les paramètres manquants avant publication
        run: node scripts/check-deployment-config.cjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Vérifier les contrôles du backend en ligne
        run: node --test scripts/check-live-backend.test.cjs scripts/check-deployment-config.test.cjs
      - name: Vérifier la syntaxe de la récupération administrateur
        run: |
          node --check backend/public/admin/password-recovery.js
          node --check scripts/check-password-recovery.cjs
      - name: Construire le conteneur du backend
        run: docker build --tag cv-backend .
      - name: Vérifier API, transactions et sauvegardes dans le conteneur
        run: docker run --rm --env NODE_ENV=test cv-backend npm test
      - name: Vérifier la génération réelle du PDF dans le conteneur
        run: docker run --rm --env NODE_ENV=test cv-backend npm run test:pdf
  serverless:
    name: Vérifier API et PDF dans le handler Netlify
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run test:netlify --prefix backend
      - name: Construire le paquet Netlify sans accès au compte
        run: npx --yes netlify-cli@27.12.0 build --offline
      - name: Vérifier les mêmes endpoints dans le paquet final
        run: npm run test:bundle --prefix backend
  frontend:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/configure-frontend.cjs
      - run: npm run build -- --configuration production --base-href /
  deploy-backend:
    name: Publier Angular et Express ensemble sur Netlify
    if: github.ref == 'refs/heads/main'
    needs: [backend, serverless, frontend, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Envoyer le commit vérifié à la branche de production Netlify
        run: git push origin HEAD:refs/heads/netlify-production
      - name: Vérifier Angular, le commit publié, le CV, CORS et le PDF
        run: node scripts/check-live-backend.cjs
      - name: Vérifier la publication de la récupération administrateur
        run: node scripts/check-password-recovery.cjs
